services:
  - type: web
    name: photobooth-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PB_DATABASE_URL
        sync: false
      - key: PB_JWT_SECRET
        generateValue: true
      - key: PB_CORS_ORIGINS
        value: '["https://photobooth-cache-demo.vercel.app"]'
