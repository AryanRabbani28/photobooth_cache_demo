name: Uptime Ping

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {} # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -sf https://photobooth-cache-demo-1per.onrender.com/health \
            --max-time 30 --retry 2 --retry-delay 5
